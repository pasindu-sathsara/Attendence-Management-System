<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration — ICT Attendance</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .student-registration select {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #bdc9d8;
            border-radius: 4px;
            background: white;
            color: #142d4e;
            font: inherit;
        }

        .student-registration select:focus-visible {
            outline: 2px solid #142d4e;
            outline-offset: 3px;
        }

        .field-help {
            margin: -12px 0 20px;
            color: #607086;
            font-size: 13px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <main class="login-page">
        <header class="page-heading">
            <h1>ICT Department Attendance System</h1>
            <p>Rajarata University of Sri Lanka</p>
        </header>

        <section
            class="login-card student-registration"
            aria-labelledby="register-heading">

            <h2 id="register-heading">Create Student Account</h2>

            <p class="description">
                Enter your student details to register.
            </p>

            <form
                id="registration-form"
                action="student-register.php"
                method="post">

                <label for="full-name">Full Name</label>
                <input
                    type="text"
                    id="full-name"
                    name="full_name"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required
                >

                <label for="registration-number">
                    Registration Number
                </label>
                <input
                    type="text"
                    id="registration-number"
                    name="registration_number"
                    placeholder="Example: 2023/ICT/001"
                    required
                >

                <label for="batch">Batch</label>
                <select id="batch" name="batch_id" required>
                    <option value="" selected disabled>
                        Select your batch
                    </option>
                    <option value="1">2022/2023</option>
                    <option value="2">2023/2024</option>
                    <option value="3">2024/2025</option>
                </select>

                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    autocomplete="email"
                    required
                >

                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    autocomplete="username"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    minlength="8"
                    aria-describedby="password-help"
                    required
                >

                <p id="password-help" class="field-help">
                    Use at least 8 characters.
                </p>

                <label for="confirm-password">Confirm Password</label>
                <input
                    type="password"
                    id="confirm-password"
                    name="confirm_password"
                    placeholder="Enter your password again"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

                <button type="submit" class="sign-in-button">
                    Create Student Account
                </button>
            </form>

            <div class="registration">
                <p>Already have an account?</p>

                <a class="create-account" href="UI.html">
                    Back to Login
                </a>
            </div>
        </section>
    </main>

    <script>
        const form = document.getElementById("registration-form");
        const password = document.getElementById("password");
        const confirmation = document.getElementById("confirm-password");

        function checkPasswords() {
            if (confirmation.value !== password.value) {
                confirmation.setCustomValidity(
                    "The passwords do not match."
                );
            } else {
                confirmation.setCustomValidity("");
            }
        }

        password.addEventListener("input", checkPasswords);
        confirmation.addEventListener("input", checkPasswords);

        form.addEventListener("submit", function (event) {
            checkPasswords();

            if (!form.checkValidity()) {
                event.preventDefault();
                form.reportValidity();
            }
        });
    </script>
</body>
</html>
