<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Staff Registration — ICT Attendance</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .field-help {
            margin: -12px 0 20px;
            color: #607086;
            font-size: 13px;
            line-height: 1.5;
        }

        .approval-note {
            margin: 0 0 24px;
            padding: 12px;
            border: 1px solid #d8e0ea;
            border-radius: 4px;
            background: #edf4ff;
            color: #142d4e;
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <main class="login-page">
        <header class="page-heading">
            <h1>ICT Department Attendance System</h1>
            <p>Rajarata University of Sri Lanka</p>
        </header>

        <section
            class="login-card"
            aria-labelledby="register-heading">

            <h2 id="register-heading">Create Staff Account</h2>

            <p class="description">
                Enter your staff details to request an account.
            </p>

            <p class="approval-note">
                Your account requires approval from the HOD or
                administrator before you can sign in.
            </p>

            <form
                id="registration-form"
                action="staff-register.php"
                method="post">

                <label for="full-name">Full Name</label>
                <input
                    type="text"
                    id="full-name"
                    name="full_name"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required
                >

                <label for="employee-number">Employee Number</label>
                <input
                    type="text"
                    id="employee-number"
                    name="employee_number"
                    placeholder="Enter your employee number"
                    required
                >

                <label for="email">University Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your university email"
                    autocomplete="email"
                    required
                >

                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    autocomplete="username"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    minlength="8"
                    aria-describedby="password-help"
                    required
                >

                <p id="password-help" class="field-help">
                    Use at least 8 characters.
                </p>

                <label for="confirm-password">Confirm Password</label>
                <input
                    type="password"
                    id="confirm-password"
                    name="confirm_password"
                    placeholder="Enter your password again"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

                <button type="submit" class="sign-in-button">
                    Request Staff Account
                </button>
            </form>

            <div class="registration">
                <p>Already have a staff account?</p>

                <a class="create-account" href="UI.html">
                    Back to Login
                </a>
            </div>
        </section>
    </main>

    <script>
        const form = document.getElementById("registration-form");
        const password = document.getElementById("password");
        const confirmation = document.getElementById("confirm-password");

        function checkPasswords() {
            if (confirmation.value !== password.value) {
                confirmation.setCustomValidity(
                    "The passwords do not match."
                );
            } else {
                confirmation.setCustomValidity("");
            }
        }

        password.addEventListener("input", checkPasswords);
        confirmation.addEventListener("input", checkPasswords);

        form.addEventListener("submit", function (event) {
            checkPasswords();

            if (!form.checkValidity()) {
                event.preventDefault();
                form.reportValidity();
            }
        });
    </script>
</body>
</html>
