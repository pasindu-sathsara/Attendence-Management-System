<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Staff Registration — ICT Attendance</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .field-help {
            margin: -12px 0 20px;
            color: #607086;
            font-size: 13px;
            line-height: 1.5;
        }

        .approval-note {
            margin: 0 0 24px;
            padding: 12px;
            border: 1px solid #d8e0ea;
            border-radius: 4px;
            background: #edf4ff;
            color: #142d4e;
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
<meta name="csrf-token" content="{{ session['csrf'] }}">
</head>
<body data-role="{{ session.get('role', '') }}">
    <main class="login-page">
        <header class="page-heading">
            <h1>ICT Department Attendance System</h1>
            <p>Rajarata University of Sri Lanka</p>
        </header>

        <section
            class="login-card"
            aria-labelledby="register-heading">

            <h2 id="register-heading">Create Staff Account</h2>

            <p class="description">
                Contact the department to obtain a staff account.
            </p>

            

            <p class="approval-note">Staff accounts are created by the system administrator. Contact your department to obtain an account.</p>

            <div class="registration">
                <p>Already have a staff account?</p>

                <a class="create-account" href="UI.html">
                    Back to Login
                </a>
            </div>
        </section>
    </main>

    <script src="/static/common.js"></script>

</body>
</html>
