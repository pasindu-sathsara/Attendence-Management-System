{% extends 'base.html' %}{% block title %}Dashboard{% endblock %}{% block content %}
<div class="page-title"><div><h1>Dashboard</h1><span class="muted">Class attendance</span></div><button id="open-session">+ Create Class Session</button></div>
<section class="card"><h2>Select a Class</h2><div class="grid"><div><label for="semester">Semester</label><select id="semester"></select></div><div><label for="course">Module</label><select id="course"></select></div><div><label for="class-session">Class Session</label><select id="class-session"></select></div></div><div class="actions">{% if session.role!='ar' %}<button id="mark" disabled>Mark Attendance</button>{% endif %}<button id="update" class="secondary" disabled>Update Attendance</button></div><p id="dashboard-message" class="message" role="status"></p></section>
<dialog id="session-dialog"><div class="dialog-head"><h2>Create Class Session</h2><button class="secondary" data-close="session-dialog">Close</button></div><form id="session-form"><div class="grid"><div><label for="session-course">Module</label><select id="session-course" name="course" required></select></div><div><label for="session-date">Date</label><input id="session-date" name="date" type="date" required></div><div><label for="session-week">Week</label><input id="session-week" name="week" type="number" min="1" max="14" required></div></div><div class="actions"><button id="create-session">Create Session</button></div></form><p id="session-message" class="message" role="status"></p></dialog>
<dialog id="attendance-dialog"><div class="dialog-head"><h2 id="attendance-title">Mark Attendance</h2><button class="secondary" id="close-attendance">Close</button></div><p class="muted" id="attendance-class"></p><div class="grid"><div><label for="attendance-search">Search Registration Number</label><input id="attendance-search" type="search"></div><div class="actions"><button id="all-present" class="secondary">Mark All Present</button></div></div><div id="attendance-counts" class="stats"></div><div class="table-wrap"><table><thead><tr><th>Registration Number</th><th>Attendance</th></tr></thead><tbody id="attendance-rows"></tbody></table></div><div class="actions"><button id="save-attendance">Save Attendance</button></div><p id="attendance-message" class="message" role="status"></p></dialog>
{% endblock %}{% block scripts %}<script src="/static/dashboard.js"></script>{% endblock %}
