<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="csrf-token" content="{{ session.csrf }}">
 <title>{{ portal|capitalize }} Login</title>
 <link rel="stylesheet" href="/static/app.css">
</head>
<body data-portal="{{ portal }}">
 <main class="login-main">
  <span class="brand">Attendance Management System</span>
  <section class="card">
   <nav class="login-tabs" aria-label="Login type">
    <a href="/UI.html" class="{{ 'active' if portal=='student' else '' }}" {% if portal=='student' %}aria-current="page"{% endif %}>Student Login</a>
    <a href="/staff-login.html" class="{{ 'active' if portal=='staff' else '' }}" {% if portal=='staff' %}aria-current="page"{% endif %}>Staff Login</a>
   </nav>
   <form id="login-form">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="full" id="sign-in">Sign In</button>
   </form>
   <p id="login-message" class="message" role="status"></p>
  </section>
 </main>
 <script src="/static/common.js"></script>
 <script src="/static/login.js"></script>
</body>
</html>
