<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ICT Attendance — Login</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="login-page">
        <img
    src="images/Slider-1.jpg"
    alt="University campus buildings"
    class="campus-banner"
>
        <header class="page-heading">
            <h1>ICT Department Attendance System</h1>
            <p>Rajarata University of Sri Lanka</p>
        </header>

        <section class="login-card" aria-labelledby="login-heading">
            <div class="role-selector"
                 role="group"
                 aria-label="Choose your login role">

                <button
                    type="button"
                    class="role-button active"
                    data-role="student"
                    aria-pressed="true">
                    Student
                </button>

                <button
                    type="button"
                    class="role-button"
                    data-role="staff"
                    aria-pressed="false">
                    Staff
                </button>
            </div>

            <h2 id="login-heading">Student Login</h2>

            <p id="description" class="description">
                View your attendance and student profile.
            </p>

            <form
                id="login-form"
                action="student-login.php"
                method="post">

                <label for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button
                    id="sign-in"
                    class="sign-in-button"
                    type="submit">
                    Student Sign In
                </button>
            </form>

            <div class="registration">
                <p id="account-message">
                    Don't have a student account?
                </p>

                <a
                    id="create-account"
                    class="create-account"
                    href="student-register.html">
                    Create Student Account
                </a>
            </div>
        </section>
    </main>

    <script>
        const roleButtons = document.querySelectorAll(".role-button");
        const heading = document.getElementById("login-heading");
        const description = document.getElementById("description");
        const form = document.getElementById("login-form");
        const signIn = document.getElementById("sign-in");
        const accountMessage = document.getElementById("account-message");
        const createAccount = document.getElementById("create-account");

        let currentRole = "student";

        function updateLogin(selectedRole) {
            const isStaff = selectedRole === "staff";

            heading.textContent = isStaff
                ? "Staff Login"
                : "Student Login";

            description.textContent = isStaff
                ? "For lecturers and department staff."
                : "View your attendance and student profile.";

            signIn.textContent = isStaff
                ? "Staff Sign In"
                : "Student Sign In";

            accountMessage.textContent = isStaff
                ? "Don't have a staff account?"
                : "Don't have a student account?";

            createAccount.textContent = isStaff
                ? "Create Staff Account"
                : "Create Student Account";

            createAccount.href = isStaff
                ? "staff-register.html"
                : "student-register.html";

            form.action = isStaff
                ? "staff-login.php"
                : "student-login.php";

            roleButtons.forEach(function (button) {
                const selected = button.dataset.role === selectedRole;

                button.classList.toggle("active", selected);
                button.setAttribute("aria-pressed", String(selected));
            });

            if (selectedRole !== currentRole) {
                form.reset();
            }

            currentRole = selectedRole;
        }

        roleButtons.forEach(function (button) {
            button.addEventListener("click", function () {
                updateLogin(button.dataset.role);
            });
        });

        updateLogin(currentRole);
    </script>
</body>
</html>
